name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgres://dnd:dnd@localhost:5432/dnd_lm

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dnd
          POSTGRES_PASSWORD: dnd
          POSTGRES_DB: dnd_lm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnd -d dnd_lm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Apply migrations
        run: pnpm db:migrate

      # The authorization tests need a real database; app.harness.ts fails the
      # run rather than skipping if DATABASE_URL is missing under CI.
      - name: Tests
        run: pnpm test

      # M0.2: the checked-in migrations must be exactly what the Drizzle schema
      # generates. Anything else means a schema edit shipped without a migration.
      - name: Migration drift
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- apps/api/drizzle)" ]; then
            echo "::error::Drizzle schema drifted from apps/api/drizzle - run 'pnpm db:generate' and commit the migration."
            git status --porcelain -- apps/api/drizzle
            exit 1
          fi
