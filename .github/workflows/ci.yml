name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgres://dnd:dnd@localhost:5432/dnd_lm

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dnd
          POSTGRES_PASSWORD: dnd
          POSTGRES_DB: dnd_lm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnd -d dnd_lm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Apply migrations
        run: pnpm db:migrate

      # The authorization tests need a real database; app.harness.ts fails the
      # run rather than skipping if DATABASE_URL is missing under CI.
      - name: Tests
        run: pnpm test

      # M0.2: the checked-in migrations must be exactly what the Drizzle schema
      # generates. Anything else means a schema edit shipped without a migration.
      - name: Migration drift
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- apps/api/drizzle)" ]; then
            echo "::error::Drizzle schema drifted from apps/api/drizzle - run 'pnpm db:generate' and commit the migration."
            git status --porcelain -- apps/api/drizzle
            exit 1
          fi

  # --- sdlc gate ----------------------------------------------------------
  # These live in this workflow rather than a separate one on purpose: every job
  # in a run sees the same commit, so `needs:` IS the evidence contract. A review
  # produced by another workflow could be about a different commit.
  #
  # Pull requests only - there is no PR to gate on a plain push.

  scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
      # Secret scanning is a repository setting (push protection), not a job.
      # See SDLC.md. Do not reimplement it here.

  review:
    if: github.event_name == 'pull_request'
    needs: [check, scan] # do not spend a review on a broken build
    runs-on: ubuntu-latest
    permissions:
      contents: read # the reviewer cannot push to the branch it reviews
      pull-requests: write # it can only comment
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - run: pip install pyyaml==6.0.2

      - name: Reviewer self-check
        run: python3 tools/sdlcreview.py --selftest

      # Any OpenAI-style /chat/completions host - set the two repo variables and
      # the secret. The review procedure itself lives in
      # .claude/skills/sdlc-review/SKILL.md; the script only carries it.
      - name: Independent review
        env:
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE...$HEAD" | python3 tools/sdlcreview.py

      - name: Post findings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          test -f review.md || exit 0
          gh pr comment "$PR" --body-file review.md

      - uses: actions/upload-artifact@v4
        with:
          name: sdlc-review
          path: review.json

  sdlc:
    if: github.event_name == 'pull_request'
    needs: [check, scan, review]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: sdlc-review

      - run: pip install pyyaml==6.0.2

      - name: Gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sdlcctl.py check --review review.json --json
